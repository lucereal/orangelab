# Token dock — ESPHome (v1: one dock, one action per token).
# Flash from the ESPHome add-on. Copy secrets.yaml.example → secrets.yaml.
# PN532 I2C jumpers: typically switch 1 ON, switch 2 OFF. SDA GPIO21, SCL GPIO22.

substitutions:
  name: token-dock
  friendly_name: Token dock
  scanner_id: "1"
  led_pin: GPIO4
  num_leds: "25"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Scan topic only. Entities (LED) come in through the HA API, not MQTT discovery.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

pn532_i2c:
  update_interval: 1s
  on_tag:
    then:
      - mqtt.publish:
          topic: token/dock/scan
          payload: !lambda |-
            std::string uid;
            for (char c : x) {
              if (c == '-') continue;
              uid += static_cast<char>(toupper(static_cast<unsigned char>(c)));
            }
            return std::string("{\"uid\":\"") + uid + "\",\"scanner_id\":${scanner_id}}";
      - homeassistant.tag_scanned: !lambda "return x;"
      - light.turn_on:
          id: result_led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 80%
      - delay: 250ms
      - light.turn_off:
          id: result_led

light:
  - platform: esp32_rmt_led_strip
    id: result_led
    name: Result LED
    pin: ${led_pin}
    num_leds: ${num_leds}
    chipset: WS2812
    channel_colors: GRB
